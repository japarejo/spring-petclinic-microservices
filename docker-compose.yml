services:
  mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u petclinic --password=petclinic --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.springboot
      args:
        MODULE: microservices/registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.springboot
      args:
        MODULE: microservices/configuration-server
    environment:
      EUREKA_URI: http://registry:8761/eureka
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8889:8889"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8889/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.springboot
      args:
        MODULE: microservices/admin-server
    environment:
      EUREKA_URI: http://registry:8761/eureka
    ports:
      - "9090:9090"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bills-microservice:
    build:
      context: .
      dockerfile: docker/Dockerfile.springboot
      args:
        MODULE: microservices/billsmicroservice
    environment:
      EUREKA_URI: http://registry:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8889
    ports:
      - "8040:8040"
    depends_on:
      registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  monolith:
    build:
      context: .
      dockerfile: docker/Dockerfile.springboot
      args:
        MODULE: spring-petclinic-monolith
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
      EUREKA_URI: http://registry:8761/eureka
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
