spring.application.name=bills-microservice
application.name=bills-microservice
spring.profiles.active=development
api.version=v1
server.port=8040
# Eureka service resgistry configuration:
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.metadata-map.startup=${random.int}
# OpenApi Docs configuration:
springdoc.api-docs.path=/doc
springdoc.swagger-ui.path=/
# Security
jwt.secret=En un lugar de la mancha ...
user.role=admin
# Remote config
spring.config.import=optional:configserver:
spring.cloud.config.uri=${CONFIG_SERVER_URI:http://localhost:8889}
spring.cloud.config.fail-fast=false
# Actuator endpoints for Spring Boot Admin demos. Reduce this list in production.
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,configprops,refresh
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Bills microservice registered in Eureka and configured by Config Server
