spring.application.name=config-server
spring.profiles.active=native
server.port=8889

eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

springdoc.api-docs.path=/doc
springdoc.swagger-ui.path=/

# Native backend for classroom demos. It serves files from src/main/resources/config-repo.
spring.cloud.config.server.native.search-locations=classpath:/config-repo

# Git backend variant for the production discussion:
# spring.profiles.active=git
# spring.cloud.config.server.git.uri=file:///c:/config-repo
# spring.cloud.config.server.git.clone-on-start=true

management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Petclinic Spring Cloud Config Server
